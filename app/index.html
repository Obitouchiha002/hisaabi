<!-- Fonts app ke andar hi hain. Pehle Google se aate the — do wajah se galat tha:
     (1) offline pe app bhaddi dikhti thi, jabki hum "offline chalta hai" kehte hain
     (2) har launch pe Google ko ek request jati thi, jabki hum "koi tracking nahi" kehte hain -->
<link rel="stylesheet" href="./fonts/fonts.css">
<script>
  (function () {
    var t = localStorage.getItem('hisaabi-theme') ||
            (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', t);
    var a = localStorage.getItem('hisaabi-accent');
    if (a && a !== 'nimbu') document.documentElement.setAttribute('data-accent', a);
  })();
</script>
